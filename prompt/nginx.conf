# 前端生产环境 nginx 配置：托管 Vue 构建产物，/api 反向代理到后端服务
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由（history 模式）回退到入口
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器（docker-compose 服务名 backend）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;   # 首次检测含模型加载，放宽超时
    }
}
